<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINH AN MOD – ASSET EDITOR</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#05080d;--panel:#0b121b;--line:#12384a;--neon:#00f0ff;--neon2:#39ff88;--gold:#ffc83a;--tx:#cfe9f2;--mut:#6f8d9b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:16px;letter-spacing:2px;color:var(--neon);text-shadow:0 0 10px var(--neon)}
h1 span{color:var(--neon2)}
.btn{background:transparent;color:var(--neon);border:1px solid var(--neon);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;box-shadow:0 0 8px #00f0ff44}
.btn:hover{background:#00f0ff22}.btn.g{color:var(--neon2);border-color:var(--neon2);box-shadow:0 0 8px #39ff8844}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:12px;max-width:1000px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:2px;color:var(--mut)}
.panel{background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{width:100%;max-height:66vh;touch-action:pan-y;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg image{pointer-events:none}
#rc{touch-action:none}
.sv{fill:#ffc83a;font-size:7px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:2px;font-weight:600}
#rc{fill:#ffc83a14;stroke:var(--gold);stroke-width:2;cursor:grab;filter:drop-shadow(0 0 4px var(--gold))}
#rx{stroke:var(--gold);stroke-width:.8;opacity:.7;pointer-events:none}
#ghost{pointer-events:none}#ghost circle,#ghost path{fill:none;stroke:var(--neon);stroke-width:1.2;stroke-dasharray:4 3}
.oa{cursor:pointer}.oa circle{fill:#ffc83a33;stroke:#8a6c20;stroke-width:1}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tab{padding:8px 2px;font-size:11px;text-align:center;border:1px solid var(--line);border-radius:8px;background:none;color:var(--tx);cursor:pointer}
.tab.on{border-color:var(--neon2);color:var(--neon2);box-shadow:0 0 8px #39ff8855}
.row{display:grid;grid-template-columns:22px 1fr 124px;gap:8px;align-items:center;margin:6px 0}
.row label{color:var(--neon);font-weight:600}
.grp{margin-top:10px;font-size:12px;color:var(--neon2);letter-spacing:1px}
.nb{display:flex;gap:3px}
.pm{width:26px;flex:none;background:#050a10;color:var(--neon);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit}
input[type=range]{width:100%;accent-color:var(--neon)}
input[type=number]{width:100%;min-width:0;background:#050a10;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
.mut{color:var(--mut);font-size:12px}
.wide{grid-column:1/-1}
</style>
</head>
<body>
<header>
 <h1>MINH AN MOD <span>//</span> ASSET EDITOR</h1>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn" id="load">Nạp assetindexer</button>
  <button class="btn g" id="exp">Xuất &amp; tải xuống</button>
  <input type="file" id="file" hidden>
 </div>
</header>

    <g id="ring"><circle id="rc" r="16"/><path id="rx"/><text class="sv" id="rt" y="-24"></text></g>
   </svg>
  </div>
  <div class="mut" id="dl" style="margin-top:8px"></div>
 </section>
 <section class="card">
  <h2>THÔNG SỐ — <span id="cur" style="color:var(--neon2)">HEAD</span></h2>
  <div class="tabs" id="tabs"></div>
  <div id="ctl"></div>
  <button class="btn" id="rst" style="margin-top:8px">Đặt lại vùng này</button>
 </section>
 <section class="card wide">
  <div class="mut" id="src">Chưa nạp file. Nạp file assetindexer thật, chỉnh thông số rồi bấm Xuất: file xuất ra là file đã sửa trực tiếp bên trong.</div>
 </section>
</main>
<script>
const R=[['HEAD',97,77],['NECK',97,100],['CHEST',97,143],['ABDOMEN',97,183]],RAD=16;
const BONE={HEAD:'bone_Head',NECK:'bone_Neck',CHEST:'bone_Spine1',ABDOMEN:'bone_Spine'};
const mk=(x,y)=>({pos:[0,0,0],rot:[0,0,0],scl:[1,1,1],o:{pos:[0,0,0],rot:[0,0,0],scl:[1,1,1]},ax:x,ay:y});
const S={};R.forEach(([k,x,y])=>S[k]=mk(x,y));
let act='HEAD',src=null,occ={};
const $=id=>document.getElementById(id),svg=$('svg'),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const DP={pos:5,rot:3,scl:3};

R.forEach(([k])=>{const b=document.createElement('button');b.className='tab';b.textContent=k;b.id='t'+k;b.onclick=()=>{act=k;sync()};$('tabs').append(b)});
$('anch').addEventListener('pointerdown',e=>{const g=e.target.closest('.oa');if(g){act=g.dataset.k;sync()}});

const GR=[['pos','POSITION',.001],['rot','ROTATION (độ)',.5],['scl','SCALE',.01]];
GR.forEach(([g,n,st])=>{
 const h=document.createElement('div');h.className='grp';h.textContent=n;$('ctl').append(h);
 ['X','Y','Z'].forEach((a,i)=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<label>${a}</label><input type="range" step="${g==='pos'?.0005:st}" id="r_${g}${i}"><div class="nb"><button class="pm">−</button><input type="number" step="${st}" id="n_${g}${i}"><button class="pm">+</button></div>`;
  $('ctl').append(d);
  const up=v=>{v=parseFloat(v);if(isNaN(v))return;S[act][g][i]=+v.toFixed(DP[g]);sync()};
  const nb=d.children[2];
  d.children[1].oninput=e=>up(e.target.value);
  nb.children[1].oninput=e=>up(e.target.value);
  nb.children[0].onclick=()=>up(S[act][g][i]-st);
  nb.children[2].onclick=()=>up(S[act][g][i]+st);
 });
});

function sync(){
 const v=S[act],ex=RAD+8,cross=`M${-ex} 0H${ex}M0 ${-ex}V${ex}`;
 GR.forEach(([g])=>[0,1,2].forEach(i=>{
  const val=+v[g][i].toFixed(DP[g]),r=$('r_'+g+i),o=v.o[g][i];
  if(g==='pos'){r.min=o-.5;r.max=o+.5}else if(g==='rot'){r.min=-180;r.max=180}else{r.min=.1;r.max=3}
  r.value=val;if(document.activeElement!==$('n_'+g+i))$('n_'+g+i).value=val;
 }));
 $('ring').setAttribute('transform',`translate(${v.ax} ${v.ay})`);
 $('rx').setAttribute('d',cross);$('gx').setAttribute('d',cross);
 $('rt').textContent=act;
 const dp=v.pos.map((x,i)=>x-v.o.pos[i]);
 $('ghost').setAttribute('transform',`translate(${v.ax+dp[0]*200} ${v.ay-dp[1]*200}) rotate(${v.rot[2]-v.o.rot[2]}) scale(${v.scl[0]/v.o.scl[0]} ${v.scl[1]/v.o.scl[1]})`);
 $('anch').innerHTML=R.filter(([k])=>k!==act).map(([k])=>`<g class="oa" data-k="${k}" transform="translate(${S[k].ax} ${S[k].ay})"><circle r="6"/><text class="sv" y="-10">${k}</text></g>`).join('');
 $('dl').textContent=`${act} = ${BONE[act]}`+(src?` · ${(occ[act]||[]).length} bản ghi trong file`:' · chưa nạp file');
 $('cur').textContent=act;
 R.forEach(([k])=>$('t'+k).classList.toggle('on',k===act));
}

let drag=null;
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
const rc=$('rc');
rc.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
svg.addEventListener('contextmenu',e=>e.preventDefault());
rc.addEventListener('pointerdown',e=>{const p=pt(e),s=S[act];drag={dx:p.x-s.ax,dy:p.y-s.ay};rc.setPointerCapture(e.pointerId);rc.style.cursor='grabbing'});
rc.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),s=S[act];s.ax=cl(p.x-drag.dx,0,200);s.ay=cl(p.y-drag.dy,0,400);sync()});
const end=()=>{drag=null;rc.style.cursor='grab'};rc.addEventListener('pointerup',end);rc.addEventListener('pointercancel',end);
$('rst').onclick=()=>{const s=S[act];s.pos=[...s.o.pos];s.rot=[...s.o.rot];s.scl=[...s.o.scl];sync()};

// ---- UnityFS ----
function lz4(s,n){const o=new Uint8Array(n);let i=0,p=0;while(i<s.length){const t=s[i++];let l=t>>4;if(l===15){let b;do{b=s[i++];l+=b}while(b===255)}for(let k=0;k<l;k++)o[p++]=s[i++];if(i>=s.length)break;const off=s[i]|s[i+1]<<8;i+=2;let m=t&15;if(m===15){let b;do{b=s[i++];m+=b}while(b===255)}m+=4;for(let k=0;k<m;k++){o[p]=o[p-off];p++}}return o}
function dataStart(u8){
 const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let p=0;
 const cs=()=>{let e=p;while(u8[e])e++;const s=new TextDecoder().decode(u8.subarray(p,e));p=e+1;return s};
 if(cs()!=='UnityFS')throw Error('Không phải file UnityFS');
 const ver=dv.getUint32(p);p+=4;cs();cs();p+=8;
 const csz=dv.getUint32(p),usz=dv.getUint32(p+4),fl=dv.getUint32(p+8);p+=12;
 if(ver>=7)p=(p+15)&~15;
 const ct=fl&63,raw=fl&0x80?u8.subarray(u8.length-csz):u8.subarray(p,p+csz);
 const bi=ct===0?raw:(ct===2||ct===3)?lz4(raw,usz):null;
 if(!bi)throw Error('Kiểu nén LZMA chưa hỗ trợ');
 const bv=new DataView(bi.buffer,bi.byteOffset,bi.byteLength),nb=bv.getUint32(16);
 for(let i=0;i<nb;i++)if(bv.getUint16(20+i*10+8)&63)throw Error('Dữ liệu trong file bị nén, chưa hỗ trợ');
 return fl&0x80?p:p+csz;
}
const eq=(u8,i,pat)=>{for(let j=0;j<pat.length;j++)if(u8[i+j]!==pat[j])return false;return true};
function scan(u8,start){
 const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),res={};
 for(const k in BONE){
  const pat=new TextEncoder().encode(BONE[k]);res[k]=[];
  for(let i=start+44;i<u8.length-pat.length;i++){
   if(u8[i]!==98||!eq(u8,i,pat)||dv.getUint32(i-4,true)!==pat.length)continue;
   const f=i-44,g=n=>dv.getFloat32(f+n*4,true);
   if(Math.abs(Math.hypot(g(3),g(4),g(5),g(6))-1)>.01)continue;
   if([7,8,9].some(n=>!(g(n)>.001&&g(n)<1000)))continue;
   res[k].push(f);
  }}
 return res;
}
const D=180/Math.PI,nz=a=>{a%=360;return a>180?a-360:a<-180?a+360:a};
function toEuler(x,y,z,w){
 const sx=cl(2*(w*x-y*z),-1,1);
 return[nz(Math.asin(sx)*D),nz(Math.atan2(2*(w*y+z*x),1-2*(x*x+y*y))*D),nz(Math.atan2(2*(w*z+x*y),1-2*(x*x+z*z))*D)];
}
function fromEuler(a,b,c){
 const r=Math.PI/360,sx=Math.sin(a*r),cx=Math.cos(a*r),sy=Math.sin(b*r),cy=Math.cos(b*r),sz=Math.sin(c*r),cz=Math.cos(c*r);
 return[sx*cy*cz+cx*sy*sz,cx*sy*cz-sx*cy*sz,cx*cy*sz-sx*sy*cz,cx*cy*cz+sx*sy*sz];
}
function qmul(a,b){return[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]]}

$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const u8=new Uint8Array(await f.arrayBuffer()),st=dataStart(u8),o=scan(u8,st);
  const dv=new DataView(u8.buffer);
  R.forEach(([k,x,y])=>{
   const a=o[k][0],s=mk(x,y);S[k].o=s.o;
   if(a!==undefined){
    const g=n=>dv.getFloat32(a+n*4,true),r5=v=>+v.toFixed(5),r3=v=>+v.toFixed(3);
    const pos=[0,1,2].map(n=>r5(g(n))),rot=toEuler(g(3),g(4),g(5),g(6)).map(r3),scl=[7,8,9].map(n=>r3(g(n)));
    S[k].o={pos,rot,scl};S[k].pos=[...pos];S[k].rot=[...rot];S[k].scl=[...scl];
   }
  });
  src={name:f.name,u8};occ=o;
  const found=R.map(([k])=>`${k} (${o[k].length})`).join(', ');
  $('src').textContent=`Đã nạp: ${f.name} (${(f.size/1024).toFixed(1)} KB). Tìm thấy: ${found}. Giá trị hiện tại của file đã hiện ở thông số.`;
  sync();
 }catch(err){$('src').textContent='Lỗi: '+err.message}
};

// ---- ghi vào file ----
function patched(){
 const out=src.u8.slice(),dv=new DataView(out.buffer);let n=0;
 R.forEach(([k])=>{
  const s=S[k],dp=s.pos.map((v,i)=>v-s.o.pos[i]),de=s.rot.map((v,i)=>v-s.o.rot[i]),ds=s.scl.map((v,i)=>v/s.o.scl[i]);
  const cP=dp.some(v=>v),cR=de.some(v=>v),cS=ds.some(v=>v!==1);
  if(!(cP||cR||cS))return;
  occ[k].forEach(f=>{
   const g=m=>dv.getFloat32(f+m*4,true),w=(m,v)=>dv.setFloat32(f+m*4,v,true);
   if(cP)for(let i=0;i<3;i++)w(i,g(i)+dp[i]);
   if(cR){const q=qmul(fromEuler(...de),[g(3),g(4),g(5),g(6)]),l=Math.hypot(...q);for(let i=0;i<4;i++)w(3+i,q[i]/l)}
   if(cS)for(let i=0;i<3;i++)w(7+i,g(7+i)*ds[i]);
   n++;
  });
 });
 return {out,n};
}
$('exp').onclick=async()=>{
 if(!src){$('src').textContent='Hãy nạp file assetindexer trước.';return}
 const {out,n}=patched(),name=src.name+'.txt';
 try{
  const d=await claude.use('downloads');
  if(d){await d.save({filename:name,data:out});$('src').textContent=`Đã sửa ${n} bản ghi xương. Khi đưa vào game, xóa đuôi .txt để file trùng tên gốc: ${src.name}`;return}
 }catch(err){if(err&&err.code==='declined')return;$('src').textContent='Không tải được: '+(err&&err.message||err);return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download=src.name;a.click();
};
sync();
</script>
</body>
</html>
